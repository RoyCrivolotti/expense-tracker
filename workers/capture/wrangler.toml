# Accepts bank pushes from a phone's Shortcuts automation. Its own Worker on a workers.dev address, so no route of
# the app can ever accept a capture key and this one serves no app.
#
# A merge to main deploys it to staging and production through scripts/deploy-capture.mjs, which fills the Worker's name,
# the account and the database into a git-ignored copy of this file. It replaces the `name`, `database_name` and
# `database_id` lines, so keep one of each; the placeholders stay as they are.
#
# Each Worker has its secrets set once, and a deploy keeps them: CAPTURE_REPLAY_SECRET, OWNER_EMAIL (a secret or a
# variable; without it the owner's own key is refused) and, to send web push, VAPID_PRIVATE_KEY, VAPID_PUBLIC_KEY and
# VAPID_SUBJECT. See docs/CAPTURE-WORKER.md, "Deploying it".
name = "expense-capture"
main = "src/index.ts"
compatibility_date = "2024-11-12"
workers_dev = true
# Each version would otherwise get a public address of its own that runs the same code.
preview_urls = false

# One structured line per request (workers/capture/src/log.ts): outcome, reason, source, kind. No push text. Read it
# in the dashboard under the Worker's Logs, or with `wrangler tail`.
[observability]
enabled = true

# Hourly, to send the daily and weekly summaries (docs/PUSH.md, "Daily and weekly summaries"). Cloudflare's cron runs in
# UTC and knows nothing of a person's evening or of summer time, so every run asks each person what hour it is for them.
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "<database name>"
database_id = "<database id>"
