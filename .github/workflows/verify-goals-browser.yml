name: Verify Goals in a browser

# `npm run verify` cannot see layout, scroll or touch behaviour: jsdom has none. The Goals page has
# a script that drives the real thing (Chromium and WebKit, the widths a laptop and an iPad have,
# keyboard and touch), and until now it only ran when somebody remembered to. Two merges that
# each passed it alone broke main together, and a third regression only showed when it was run on
# the merged result, so it runs here: on a PR that can change what it measures, and on main after
# a merge, which is where the combination of PRs first exists.
#
# It is slow and timing sensitive, so it is its own workflow and not a step of
# Verify: it does not hold up the checks that tell a reviewer whether the code builds. It is not
# a required check until it has proved itself over a few weeks of PRs; make it one in the branch
# protection rules when you trust it.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/ui/**'
      - 'src/domain/**'
      - 'src/data/**'
      - 'scripts/verify-goals-desktop.mjs'
      - 'scripts/shardUnits.mjs'
      - 'index.html'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/verify-goals-browser.yml'
  push:
    branches: [main]
    paths:
      - 'src/ui/**'
      - 'src/domain/**'
      - 'src/data/**'
      - 'scripts/verify-goals-desktop.mjs'
      - 'scripts/shardUnits.mjs'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: expense-tracker-goals-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  goals-browser:
    name: goals-browser (${{ matrix.engine }} ${{ matrix.shard }}/${{ matrix.shards }})
    # Safari's engine is only the real one on macOS: the Linux build of WebKit scrolls and focuses
    # differently (it failed checks that pass in Safari), so it would report problems the page does
    # not have. Chromium runs on Linux, where it is quicker.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # The sections of the script are independent, so each job runs one share of them
      # (`SHARD`, below). WebKit gets fewer, and runs slower per section, because the free plan
      # runs only five macOS jobs at once.
      matrix:
        include:
          - { engine: chromium, os: ubuntu-latest, shard: 1, shards: 4 }
          - { engine: chromium, os: ubuntu-latest, shard: 2, shards: 4 }
          - { engine: chromium, os: ubuntu-latest, shard: 3, shards: 4 }
          - { engine: chromium, os: ubuntu-latest, shard: 4, shards: 4 }
          - { engine: webkit, os: macos-latest, shard: 1, shards: 3 }
          - { engine: webkit, os: macos-latest, shard: 2, shards: 3 }
          - { engine: webkit, os: macos-latest, shard: 3, shards: 3 }
    steps:
      - uses: actions/checkout@v5

      - name: Use HTTPS for git-based npm dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Cache the browser
        id: browsers
        uses: actions/cache@v5
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ matrix.engine }}-${{ hashFiles('package-lock.json') }}

      - name: Install the browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} ${{ matrix.engine }}

      - name: Install what the browser needs from the system
        if: steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: npx playwright install-deps ${{ matrix.engine }}

      - name: Run part ${{ matrix.shard }} of ${{ matrix.shards }} of the Goals page checks in ${{ matrix.engine }}
        env:
          CAPTURE_PORT: '5173'
          ENGINES: ${{ matrix.engine }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: node scripts/verify-goals-desktop.mjs

  # The one job to require once this workflow is trusted. A matrix job that failed, was
  # cancelled or never started is not `success`, and without `always()` this job would be
  # skipped in those cases, which reads as passing to anything that requires it.
  goals-browser-gate:
    name: goals-browser gate
    needs: goals-browser
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part must have passed
        run: |
          echo "result: ${{ needs.goals-browser.result }}"
          [ "${{ needs.goals-browser.result }}" = success ]
