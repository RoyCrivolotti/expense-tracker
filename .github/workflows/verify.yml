name: Verify

on:
  # No `branches:` filter on purpose. That filter matches the PR's *base*, so
  # `branches: [main]` silently gave zero CI to every stacked PR — B on top of A
  # ran nothing until A merged, which is exactly when review is too late to help.
  # Every check below is already base-agnostic: both scripts take the PR's own
  # base.sha, so they measure the PR's own diff whatever it is stacked on.
  #
  # `edited` fires on a base change (retargeting a stacked PR to main, where the
  # diff coverage baseline really does move) and on a description edit, which is
  # the channel check:pr-screenshots reads — adding the screenshot re-runs the
  # check instead of needing a close/reopen.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# A burst of description edits should not queue N three-minute runs.
concurrency:
  group: expense-tracker-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `npm run coverage:diff` needs the merge-base with the PR's base
          # branch, which a shallow clone doesn't have.
          fetch-depth: 0

      - name: Use HTTPS for git-based npm dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run verify

      - name: Diff coverage (this PR's changed lines)
        run: npm run coverage:diff -- --base ${{ github.event.pull_request.base.sha }}

      - name: Require screenshots on UI-facing PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:pr-screenshots -- --base ${{ github.event.pull_request.base.sha }} --pr ${{ github.event.pull_request.number }}
