name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: expense-tracker-deploy
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: '800abdfb2ec1687266f66fd349c41d6a'
  PROD_D1_NAME: roy-expenses
  DEV_D1_NAME: roy-expenses-dev

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Runs beside `ci`, so it adds no time. The code about to ship may read columns a migration
  # adds, so a deploy stops here, before anything is deployed, if either database is behind
  # the migration files or its record cannot be trusted. Read-only: nothing is applied.
  schema:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-deps

      - name: Production has every migration
        run: npm run migrate -- "$PROD_D1_NAME"
      - name: Production's columns are what the migrations make
        run: npm run check:schema -- "$PROD_D1_NAME"
      - name: Dev has every migration
        run: npm run migrate -- "$DEV_D1_NAME"
      - name: Dev's columns are what the migrations make
        run: npm run check:schema -- "$DEV_D1_NAME"

      - name: What to do
        if: failure()
        run: |
          echo "::error::A database is behind the migrations, or its record cannot be trusted. Nothing was deployed."
          echo "Apply the missing migrations with: npm run migrate -- <database> --apply"
          echo "(see docs/DEPLOYMENT.md, Migrations), then re-run the failed jobs of this run."

  ship:
    needs: [ci, schema]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-deps

      - name: Sync access env (owner)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: npm run sync:access-env

      - name: Deploy expense-tracker (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Deploy staging (roy-expenses-stg)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:dev

      - name: Deploy backup cron worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:backup-cron
