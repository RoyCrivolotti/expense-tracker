name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: expense-tracker-deploy
  # Queue rather than cancel. A run cancelled part way through the migration step would leave
  # dev migrated and production not, while a deploy that waits its turn only ships a little
  # later, and the newest queued run is the one that goes.
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: '800abdfb2ec1687266f66fd349c41d6a'

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use HTTPS for git-based npm dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run verify

      # Before the deploy, so the code that ships finds its columns. Each file is recorded in
      # the import that applies it, and one that would break the release still running is
      # refused; see "Migrations" in docs/DEPLOYMENT.md. Either way the deploy below does not
      # run, and the site stays on the last release.
      - name: Apply migrations (dev, then production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/migrate.mjs all --yes

      - name: Sync access env (owner)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: npm run sync:access-env

      - name: Deploy expense-tracker (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Deploy staging (roy-expenses-stg)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:dev

      - name: Deploy backup cron worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:backup-cron
