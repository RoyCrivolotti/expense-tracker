name: Deploy dev preview

on:
  # Unfiltered by base, so a stacked PR gets a preview too — see verify.yml for
  # why the `branches:` filter had to go. Safe to widen: deploy-dev.sh aliases
  # each deploy by GITHUB_HEAD_REF, so PRs get their own URL rather than fighting
  # over one. Deliberately *not* subscribed to `edited` — retitling a PR is not a
  # reason to rebuild and redeploy it.
  pull_request:
  workflow_dispatch:

concurrency:
  group: expense-tracker-deploy-dev-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: '800abdfb2ec1687266f66fd349c41d6a'

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use HTTPS for git-based npm dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run verify

      - name: Deploy preview (branch dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # `pipefail` matters here: without it, a failed `deploy:dev` piped into `tee`
        # still exits 0 (tee's own status), so the step would report success on a
        # broken deploy.
        run: |
          set -o pipefail
          npm run deploy:dev | tee deploy.log

      - name: Post staging URL to the PR description
        # Only meaningful on a pull_request run — workflow_dispatch (CLAUDE.md's
        # documented way to preview a branch with no PR yet) has no PR to edit.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(grep -oP 'Deployment alias URL: \K\S+' deploy.log || true)
          if [ -z "$url" ]; then
            echo "::warning::Could not find the deployment alias URL in wrangler's output; skipping PR description update."
            exit 0
          fi
          npm run update:pr-staging-url -- --pr ${{ github.event.pull_request.number }} --url "$url"
